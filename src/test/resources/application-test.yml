spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  datasource:
    url: jdbc:h2:mem:amazon_price_monitor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

alterlab:
  api-key: test-key

app:
  admin:
    allow-test-notification: false
  notification:
    log:
      enabled: false
    email:
      enabled: false
    sms:
      enabled: false
  scheduler:
    enabled: false
  ai:
    gemini:
      # Tests must stay deterministic and offline; the deterministic fallback summary
      # is exercised instead of any real upstream call.
      enabled: false
      api-key:
