services:
  postgres:
    image: postgres:16-alpine
    container_name: amazon-price-monitor-db
    environment:
      POSTGRES_USER: ${DB_USER:-monitor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-monitor}
      POSTGRES_DB: ${DB_NAME:-amazon_price_monitor}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-monitor} -d ${DB_NAME:-amazon_price_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: amazon-price-monitor:local
    container_name: amazon-price-monitor-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    # Load secrets and app.* / MAIL_* / TWILIO_* / GEMINI_* from this file (same directory as
    # compose). Do not duplicate them under `environment` with ${VAR:-} — when VAR is unset on the
    # *host* at compose parse time, Compose injects empty and would override these values here.
    env_file:
      - .env.local
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      SERVER_PORT: 8080
    restart: unless-stopped

volumes:
  postgres_data:
