services:
  postgres:
    image: postgres:16-alpine
    container_name: amazon-price-monitor-db
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: amazon_price_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d amazon_price_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
